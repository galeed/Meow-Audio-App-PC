name: Compilar APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generar APK con PWABuilder (Bubblewrap CLI)
        run: |
          npm install -g @bubblewrap/cli
          yes | bubblewrap init --manifest="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json"
          bubblewrap build

      - name: Subir APK Generado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Meow-Audio-App-Release-APK
          path: ./*.apk
