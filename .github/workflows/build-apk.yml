name: Compilar APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generar Proyecto Android
        run: yes | bubblewrap init --manifest="./manifest.json"

      - name: Compilar APK
        run: yes | bubblewrap build

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Meow-Audio-App-Release-APK
          path: ./*.apk
