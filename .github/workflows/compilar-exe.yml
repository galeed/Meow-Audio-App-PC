name: Compilar EXE 64-bits y Desplegar a Cloudflare R2

on:
  workflow_dispatch:

jobs:
  build-and-upload-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar ejecutable de 64 bits con IExpress
        shell: cmd
        run: |
          call build-exe.bat

      - name: Configurar AWS CLI para Cloudflare R2
        shell: cmd
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region auto

      - name: Subir EXE de Windows a Cloudflare R2
        shell: cmd
        run: |
          aws s3 cp MeowAudioApp.exe s3://%R2_BUCKET_NAME%/MeowAudioApp-x64.exe --endpoint-url %R2_ENDPOINT_URL%
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
