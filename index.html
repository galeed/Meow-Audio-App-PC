<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Michi Audio Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0a0b10;
      --card-bg: rgba(18, 22, 36, 0.75);
      --accent-cyan: #00f3ff;
      --accent-magenta: #ff0055;
      --text-main: #e0e6ed;
      --text-dim: #8a99ad;
      --border-color: rgba(0, 243, 255, 0.2);
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Reproductor Principal */
    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.67), 0 0 15px rgba(0, 243, 255, 0.1);
      width: 100%;
      max-width: 420px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    /* Botón Configuración ⚙️ */
    .config-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-dim);
      transition: color 0.3s, transform 0.3s;
      z-index: 10;
    }

    .config-toggle:hover {
      color: var(--accent-cyan);
      transform: rotate(90deg);
    }

    /* Panel de Configuración ⚙️ */
    .config-panel {
      display: none;
      background: rgba(10, 11, 16, 0.95);
      border: 1px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 16px;
      flex-direction: column;
      gap: 12px;
    }

    .config-panel.active {
      display: flex;
    }

    .config-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .config-item label {
      color: var(--text-main);
    }

    .config-item input[type="range"] {
      width: 100px;
      accent-color: var(--accent-cyan);
    }

    .config-item select {
      background: #121624;
      color: var(--accent-cyan);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: var(--font-body);
    }

    /* Layouts / Skins */
    
    /* SKIN: Meow Classic */
    .skin-classic {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .skin-classic .album-art {
      width: 220px;
      height: 220px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid var(--border-color);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      margin-bottom: 16px;
    }

    .skin-classic .meta-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 16px;
      width: 100%;
    }

    /* SKIN: Meow Modern */
    .skin-modern {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .skin-modern .header-modern {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .skin-modern .album-art {
      width: 110px;
      height: 110px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .skin-modern .meta-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
    }

    /* Metadatos y Formato */
    .track-title {
      font-family: var(--font-title);
      font-size: 1.1rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.95rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .format-badge {
      display: inline-block;
      align-self: flex-start;
      margin-top: 4px;
      font-size: 0.75rem;
      font-family: var(--font-title);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 243, 255, 0.05);
    }

    .skin-classic .format-badge {
      align-self: center;
    }

    /* Progress Bar y Tiempos */
    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
      cursor: pointer;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* Controles de Reproducción */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .btn-control {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.4rem;
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
    }

    .btn-control:hover {
      color: var(--accent-cyan);
      transform: scale(1.1);
    }

    .btn-play {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .btn-play:hover {
      background: var(--accent-cyan);
      color: var(--bg-color);
      box-shadow: 0 0 15px var(--accent-cyan);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="player-card">
    <!-- Botón Configuración ⚙️ -->
    <button class="config-toggle" id="configBtn" title="Configuración">⚙️</button>

    <!-- Panel de Configuración ⚙️ -->
    <div class="config-panel" id="configPanel">
      <div class="config-item">
        <label for="skinSelect">Estilo de Skin:</label>
        <select id="skinSelect">
          <option value="classic">Meow Classic</option>
          <option value="modern" selected>Meow Modern</option>
        </select>
      </div>

      <div class="config-item">
        <label for="crossfadeToggle">Crossfade Automático:</label>
        <input type="checkbox" id="crossfadeToggle" checked>
      </div>

      <div class="config-item">
        <label for="crossfadeTime">Duración (seg): <span id="fadeVal">3</span>s</label>
        <input type="range" id="crossfadeTime" min="1" max="5" value="3">
      </div>
    </div>

    <!-- Contenedor dinámico del Skin -->
    <div id="skinContainer" class="skin-modern">
      <div class="header-modern">
        <img src="https://via.placeholder.com/300/0a0b10/00f3ff?text=Moustache+Lab" alt="Portada" class="album-art" id="albumArt">
        <div class="meta-info">
          <div class="track-title" id="trackTitle">La colline des chats</div>
          <div class="track-artist" id="trackArtist">Joël Balam</div>
          <div class="format-badge" id="formatBadge">FLAC • 24-bit / 96kHz</div>
        </div>
      </div>
    </div>

    <!-- Barra de progreso -->
    <div class="progress-container">
      <input type="range" class="progress-bar" id="progressBar" value="0" max="100">
      <div class="time-stamps">
        <span id="currentTime">0:00</span>
        <span id="duration">3:45</span>
      </div>
    </div>

    <!-- Controles -->
    <div class="controls">
      <button class="btn-control" id="prevBtn" title="Anterior">⏮</button>
      <button class="btn-control btn-play" id="playBtn" title="Reproducir/Pausar">▶</button>
      <button class="btn-control" id="nextBtn" title="Siguiente">⏭</button>
    </div>
  </div>

  <script>
    // Audio Web API y Contexto para Crossfade seguro
    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let currentAudio = new Audio();
    let nextAudio = new Audio();
    
    // Lista de pistas demo
    const playlist = [
      { title: "La colline des chats", artist: "Joël Balam", format: "FLAC • 24-bit / 96kHz", cover: "https://via.placeholder.com/300/0a0b10/00f3ff?text=Michi+1" },
      { title: "L’enfer dans ma tête", artist: "Joël Balam", format: "FLAC • 16-bit / 44.1kHz", cover: "https://via.placeholder.com/300/0a0b10/ff0055?text=Michi+2" }
    ];
    let currentTrackIdx = 0;

    // Elementos del DOM
    const configBtn = document.getElementById('configBtn');
    const configPanel = document.getElementById('configPanel');
    const skinSelect = document.getElementById('skinSelect');
    const crossfadeToggle = document.getElementById('crossfadeToggle');
    const crossfadeTime = document.getElementById('crossfadeTime');
    const fadeVal = document.getElementById('fadeVal');
    const skinContainer = document.getElementById('skinContainer');
    const playBtn = document.getElementById('playBtn');
    const nextBtn = document.getElementById('nextBtn');

    // Desplegar/Ocultar Panel Configuración ⚙️
    configBtn.addEventListener('click', () => {
      configPanel.classList.toggle('active');
    });

    // Actualizar valor numérico del slider de Crossfade
    crossfadeTime.addEventListener('input', (e) => {
      fadeVal.textContent = e.target.value;
    });

    // Cambio de Skin (Meow Classic vs Meow Modern)
    skinSelect.addEventListener('change', (e) => {
      renderSkin(e.target.value);
    });

    function renderSkin(skin) {
      const track = playlist[currentTrackIdx];
      if (skin === 'classic') {
        skinContainer.className = 'skin-classic';
        skinContainer.innerHTML = `
          <img src="${track.cover}" alt="Portada" class="album-art" id="albumArt">
          <div class="meta-info">
            <div class="track-title" id="trackTitle">${track.title}</div>
            <div class="track-artist" id="trackArtist">${track.artist}</div>
            <div class="format-badge" id="formatBadge">${track.format}</div>
          </div>
        `;
      } else {
        skinContainer.className = 'skin-modern';
        skinContainer.innerHTML = `
          <div class="header-modern">
            <img src="${track.cover}" alt="Portada" class="album-art" id="albumArt">
            <div class="meta-info">
              <div class="track-title" id="trackTitle">${track.title}</div>
              <div class="track-artist" id="trackArtist">${track.artist}</div>
              <div class="format-badge" id="formatBadge">${track.format}</div>
            </div>
          </div>
        `;
      }
    }

    // Lógica del Crossfade al cambiar pista
    function changeTrackWithCrossfade(newIndex) {
      const isCrossfadeActive = crossfadeToggle.checked;
      const fadeDuration = parseFloat(crossfadeTime.value);

      if (isCrossfadeActive) {
        // Ejecutar desvanecimiento gradual del volumen actual
        let fadeAudio = currentAudio;
        let step = 0.05;
        let intervalTime = (fadeDuration * 1000) * (step / 1);

        let fadeOut = setInterval(() => {
          if (fadeAudio.volume > step) {
            fadeAudio.volume -= step;
          } else {
            fadeAudio.volume = 0;
            fadeAudio.pause();
            clearInterval(fadeOut);
          }
        }, intervalTime);
      } else {
        currentAudio.pause();
      }

      // Actualizar datos del nuevo track
      currentTrackIdx = newIndex;
      renderSkin(skinSelect.value);

      // Resetear volumen y reproducir la nueva pista
      currentAudio.volume = 1.0;
      playBtn.textContent = '⏸';
    }

    nextBtn.addEventListener('click', () => {
      let nextIdx = (currentTrackIdx + 1) % playlist.length;
      changeTrackWithCrossfade(nextIdx);
    });

    playBtn.addEventListener('click', () => {
      if (playBtn.textContent === '▶') {
        playBtn.textContent = '⏸';
      } else {
        playBtn.textContent = '▶';
      }
    });
  </script>
</body>
</html>
